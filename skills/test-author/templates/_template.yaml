# ac-01-<slug>.yaml
# Acceptance Criteria: AC-01 <Description of criterion from PRD/plan>
# Target App: com.example.app
appId: com.example.app
---
# 1. State setup / Navigation to target screen
- runFlow:
    file: ../_shared/_login.yaml # or relative helper path
    optional: true

# 2. Action steps (Prefer bare XML id or Compose testTag extracted from source code)
- extendedWaitUntil:
    visible:
      id: "<view_id>"
    timeout: 10000

- tapOn:
    id: "<view_id>"

# 3. Assertions (Strictly required: verify PRD/AC behavior)
- assertVisible:
    text: "<Expected text or title>"

- assertVisible:
    id: "<expected_element_id>"
